name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - name: Resolve version
        id: version
        run: |
          VERSION=$(grep -E '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//; s/\+.*//' | tr -d '[:space:]')
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec.yaml version v$VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Package tar.gz
        run: |
          mkdir -p dist
          tar -C build/linux/x64/release/bundle -czf "dist/kinesis-${{ steps.version.outputs.version }}-linux-x64.tar.gz" .
      - name: Package deb
        run: |
          V="${{ steps.version.outputs.version }}"
          ROOT="pkg/kinesis_${V}_amd64"
          mkdir -p "$ROOT/DEBIAN" "$ROOT/opt/kinesis" "$ROOT/usr/bin" "$ROOT/usr/share/applications"
          cp -r build/linux/x64/release/bundle/. "$ROOT/opt/kinesis/"
          ln -s /opt/kinesis/kinesis "$ROOT/usr/bin/kinesis"
          cat > "$ROOT/DEBIAN/control" <<CONTROL
          Package: kinesis
          Version: ${V}
          Section: utils
          Priority: optional
          Architecture: amd64
          Depends: libgtk-3-0
          Maintainer: Kinesis
          Description: A lightweight, local-first media ingest application.
          CONTROL
          sed -i 's/^          //' "$ROOT/DEBIAN/control"
          cat > "$ROOT/usr/share/applications/kinesis.desktop" <<DESKTOP
          [Desktop Entry]
          Name=Kinesis
          Exec=/opt/kinesis/kinesis
          Type=Application
          Categories=Utility;
          DESKTOP
          sed -i 's/^          //' "$ROOT/usr/share/applications/kinesis.desktop"
          dpkg-deb --build --root-owner-group "$ROOT" "dist/kinesis-${V}-linux-amd64.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve version
        id: version
        run: |
          VERSION=$(grep -E '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//; s/\+.*//' | tr -d '[:space:]')
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec.yaml version v$VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Package dmg
        run: |
          mkdir -p dist dmg
          cp -R build/macos/Build/Products/Release/kinesis.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Kinesis" -srcfolder dmg -ov -format UDZO \
            "dist/kinesis-${{ steps.version.outputs.version }}-macos.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  release:
    needs: [linux, macos]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
